<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    @font-face{font-family:Instrument Sans;src:url('/app/static/fonts/InstrumentSans-400-normal-latin.woff2') format('woff2');font-weight:400}
    @font-face{font-family:Instrument Sans;src:url('/app/static/fonts/InstrumentSans-500-normal-latin.woff2') format('woff2');font-weight:500}
    @font-face{font-family:IBM Plex Mono;src:url('/app/static/fonts/IBMPlexMono-400-normal-latin.woff2') format('woff2');font-weight:400}
    *{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;color:#17171b;font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
    .scroll{overflow-x:auto;padding-bottom:4px}.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:14px;align-items:start;min-width:1120px}
    .stage{border:1px solid #eaeaee;border-radius:9px;background:#fff;overflow:hidden}.stage-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;border-bottom:1px solid #f0f0f3}.stage-label{color:#8a8a94;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.stage-count{color:#9a9aa6;font:11px 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
    .dropzone{min-height:112px;padding:9px;background:#fafafb;transition:background .12s,box-shadow .12s}.dropzone.over{background:#edf5f4;box-shadow:inset 0 0 0 2px #7aa8a3}
    .card{position:relative;margin-bottom:8px;padding:11px;border:1px solid #e7e7eb;border-radius:7px;background:#fff;box-shadow:0 1px 2px rgba(23,23,27,.03);cursor:grab;transition:opacity .12s,box-shadow .12s,transform .12s}.card:last-of-type{margin-bottom:0}.card:hover{box-shadow:0 3px 10px rgba(23,23,27,.08)}.card.dragging{opacity:.45;transform:scale(.98);cursor:grabbing}
    .address{font-size:12.5px;font-weight:500;line-height:1.25}.place{margin-top:3px;color:#9a9aa6;font-size:11.5px}.measure{display:flex;justify-content:space-between;gap:8px;margin-top:9px;color:#8a8a94;font-size:11.5px}.measure+.measure{margin-top:3px}.measure-value{color:#3a3a44;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}.owner{margin-top:10px;padding-top:9px;border-top:1px solid #f5f5f7;color:#4a4a54;font-size:11.5px}.contact{margin-top:2px;color:#9a9aa6;font-size:11px}.dates{display:flex;align-items:center;gap:6px;margin-top:5px;color:#9a9aa6;font:11px 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}.due-over{padding:1px 5px;border-radius:3px;background:#fdf5e7;color:#8a5a12}.next{margin-top:6px;color:#77777f;font-size:11.5px}.empty{padding:14px 0;color:#c0c0c8;font-size:11.5px;text-align:center}
    .analyse{width:100%;height:27px;margin-top:10px;padding:0 9px;border:1px solid #1c4e4a;border-radius:5px;background:#1c4e4a;color:#fff;font:500 11px 'Instrument Sans',sans-serif;cursor:pointer}.analyse:hover{border-color:#143a37;background:#143a37}
    .stage-select{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.stage-select:focus{z-index:2;top:7px;right:7px;width:auto;height:26px;margin:0;clip:auto;border:1px solid #1c4e4a;border-radius:5px;background:#fff;color:#17171b}
    @media(max-width:760px){.board{grid-template-columns:repeat(5,minmax(250px,82vw));min-width:max-content;gap:10px}.card{cursor:default}}
  </style>
</head>
<body><div id="root"></div>
<script>
  const root=document.getElementById('root');let dragged=null,lastStages=[];
  const send=(type,payload={})=>parent.postMessage({isStreamlitMessage:true,type,...payload},'*');
  const emit=(type,row,extra={})=>send('streamlit:setComponentValue',{value:{type,bfs:row.bfs,parcel:String(row.parcel),...extra,eventId:`${Date.now()}-${Math.random()}`}});
  const el=(tag,cls,text)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node};
  function card(row,current){
    const node=el('article','card');node.draggable=true;node.tabIndex=0;node.setAttribute('aria-label',`${row.address}, ${row.municipality}, Stufe ${row.status}`);
    node.addEventListener('dragstart',event=>{dragged=row;node.classList.add('dragging');event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',`${row.bfs}:${row.parcel}`)});node.addEventListener('dragend',()=>{dragged=null;node.classList.remove('dragging')});
    node.append(el('div','address',row.address),el('div','place',`${row.municipality} · ${row.parcel}`));
    [['Potenzial',`${row.potential} m²`],['Landwert',row.landValue]].forEach(([label,value])=>{const line=el('div','measure');line.append(el('span','',label),el('span','measure-value',value));node.append(line)});
    node.append(el('div','owner',row.owner),el('div','contact',row.contactLine));const dates=el('div','dates');dates.append(el('span','',row.lastContact),el('span','','→'),el('span',row.overdue?'due-over':'',row.due));node.append(dates);if(row.next)node.append(el('div','next',row.next));
    const select=el('select','stage-select');select.setAttribute('aria-label','Stufe ändern');lastStages.forEach(stage=>{const option=el('option','',stage.label);option.value=stage.code;option.selected=stage.code===current;select.append(option)});select.addEventListener('change',event=>emit('move',row,{stage:event.target.value}));node.append(select);
    const button=el('button','analyse','Analyse');button.type='button';button.addEventListener('click',event=>{event.stopPropagation();emit('analyse',row)});node.append(button);return node;
  }
  function height(){requestAnimationFrame(()=>send('streamlit:setFrameHeight',{height:Math.ceil(document.documentElement.scrollHeight)}))}
  function render(args){lastStages=Array.isArray(args.stages)?args.stages:[];root.replaceChildren();const scroll=el('div','scroll'),board=el('div','board');lastStages.forEach(stage=>{const column=el('section','stage'),head=el('div','stage-head');head.append(el('span','stage-label',stage.label),el('span','stage-count',String(stage.cards?.length||0)));column.append(head);const zone=el('div','dropzone');zone.dataset.stage=stage.code;zone.addEventListener('dragover',event=>{event.preventDefault();event.dataTransfer.dropEffect='move';zone.classList.add('over')});zone.addEventListener('dragleave',event=>{if(!zone.contains(event.relatedTarget))zone.classList.remove('over')});zone.addEventListener('drop',event=>{event.preventDefault();zone.classList.remove('over');if(dragged&&dragged.statusCode!==stage.code){const moving=dragged;dragged=null;emit('move',moving,{stage:stage.code})}});(stage.cards||[]).forEach(row=>zone.append(card(row,stage.code)));if(!stage.cards?.length)zone.append(el('div','empty','Keine Einträge'));column.append(zone);board.append(column)});scroll.append(board);root.append(scroll);height()}
  addEventListener('message',event=>{if(event.data?.type==='streamlit:render')render(event.data.args||{})});addEventListener('resize',height);new ResizeObserver(height).observe(root);send('streamlit:componentReady',{apiVersion:1});height();
</script></body></html>
