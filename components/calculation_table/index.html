<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    @font-face{font-family:Instrument Sans;src:url('/app/static/fonts/InstrumentSans-400-normal-latin.woff2') format('woff2');font-weight:400}
    @font-face{font-family:Instrument Sans;src:url('/app/static/fonts/InstrumentSans-500-normal-latin.woff2') format('woff2');font-weight:500}
    @font-face{font-family:Instrument Sans;src:url('/app/static/fonts/InstrumentSans-600-normal-latin.woff2') format('woff2');font-weight:600}
    @font-face{font-family:IBM Plex Mono;src:url('/app/static/fonts/IBMPlexMono-400-normal-latin.woff2') format('woff2');font-weight:400}
    @font-face{font-family:IBM Plex Mono;src:url('/app/static/fonts/IBMPlexMono-500-normal-latin.woff2') format('woff2');font-weight:500}
    @font-face{font-family:IBM Plex Mono;src:url('/app/static/fonts/IBMPlexMono-600-normal-latin.woff2') format('woff2');font-weight:600}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#fff;color:#17171b;font-family:'Instrument Sans',sans-serif;-webkit-font-smoothing:antialiased}
    .calc__input{width:130px;height:27px;padding:0 8px;border:1px solid #1c4e4a;border-radius:5px;box-shadow:0 0 0 3px #e2eceb;font:12.5px 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;text-align:right;outline:none;background:#fff;color:#17171b}
    .calc__input[aria-invalid=true]{border-color:#a13d35;box-shadow:0 0 0 3px #fbeeed}
    .calc__error{max-width:190px;margin-top:6px;font:11px 'Instrument Sans',sans-serif;line-height:1.3;white-space:normal;color:#a13d35}
  </style>
</head>
<body>
<div id="root"></div>
<script>
  const root = document.getElementById('root');
  let current = {html:'', parcel:''};
  let editor = null;
  let refreshing = false;
  let pending = [];
  let inFlight = null;
  let lastHeight = 0;
  function send(type, data={}) {
    window.parent.postMessage({isStreamlitMessage:true, type, ...data}, '*');
  }
  function sendNextEdit() {
    if (inFlight || pending.length === 0) return;
    inFlight = pending.shift();
    send('streamlit:setComponentValue', {value:inFlight, dataType:'json'});
  }
  function height() {
    requestAnimationFrame(() => {
      const next = Math.ceil(root.getBoundingClientRect().height);
      if (next !== lastHeight) {
        lastHeight = next;
        send('streamlit:setFrameHeight', {height:next});
      }
    });
  }
  function validAmount(raw) {
    const clean = raw.replace(/CHF/gi, '').replace(/[’'\s]/g, '').replace(/−/g, '-').replace(/,/g, '.');
    return clean === '' || (/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(clean)
      && Number.isFinite(Number(clean)) && Math.abs(Number(clean)) <= 1e12);
  }
  function startEdit(button) {
    if (editor && !editor.finish(true)) return;
    let cell = button.parentElement;
    const field = button.dataset.field;
    const parcel = current.parcel;
    const input = document.createElement('input');
    input.className = 'calc__input';
    input.type = 'text';
    input.inputMode = 'decimal';
    input.maxLength = 100;
    const queuedEdit = pending.slice().reverse().find(intent =>
      intent.field === field && intent.parcel === parcel);
    const latestEdit = queuedEdit || (inFlight?.field === field && inFlight.parcel === parcel
      ? inFlight : null);
    // Reopening a row before its response arrives must show the latest intent,
    // including an empty clear, rather than the older server-rendered amount.
    const initialValue = latestEdit ? latestEdit.value
      : button.classList.contains('calc__edit--overridden')
        ? button.dataset.value : String(Math.round(Number(button.dataset.value)));
    input.value = initialValue;
    input.setAttribute('aria-label', button.getAttribute('aria-label'));
    const error = document.createElement('div');
    error.className = 'calc__error';
    error.id = 'amount-error';
    error.setAttribute('role', 'alert');
    input.setAttribute('aria-describedby', error.id);
    let finished = false;
    function finish(commit, focus=false) {
      if (finished) return true;
      if (commit && !validAmount(input.value)) {
        input.setAttribute('aria-invalid', 'true');
        error.textContent = 'Bitte einen gültigen Betrag bis 1’000’000’000’000 CHF eingeben.';
        height();
        return false;
      }
      finished = true;
      editor = null;
      cell.replaceChildren(button);
      if (focus) button.focus({preventScroll:true});
      // Merely opening/closing a rounded display must not change the precise
      // computed amount or create an accidental manual override.
      if (commit && input.value !== initialValue) {
        // Streamlit retains only the latest component value. Wait for Python
        // to acknowledge each intent before publishing the next rapid edit.
        pending.push({eventId:crypto.randomUUID(),type:'override',parcel,
          field,value:input.value});
        sendNextEdit();
      }
      height();
      return true;
    }
    editor = {
      field,
      finish,
      snapshot() {
        return {focused:document.activeElement === input, start:input.selectionStart,
          end:input.selectionEnd, direction:input.selectionDirection};
      },
      restore(nextButton, selection) {
        // Keep the actual input (including its draft and validation state), but
        // restore the latest server button when editing ends. Do not replace
        // initialValue: an untouched, rounded draft must never create an override.
        button = nextButton;
        cell = button.parentElement;
        input.setAttribute('aria-label', button.getAttribute('aria-label'));
        cell.replaceChildren(input, error);
        if (selection.focused) {
          input.focus({preventScroll:true});
          input.setSelectionRange(selection.start, selection.end, selection.direction);
        }
      }
    };
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === 'Escape') {
        event.preventDefault();
        finish(event.key === 'Enter', true);
      }
    });
    input.addEventListener('blur', () => {
      if (!refreshing) finish(true);
    });
    input.addEventListener('input', () => {
      input.removeAttribute('aria-invalid');
      error.textContent = '';
      height();
    });
    cell.replaceChildren(input, error);
    input.focus({preventScroll:true});
    input.select();
    height();
  }
  function render(args) {
    if (args.parcel !== current.parcel) {
      pending = [];
      inFlight = null;
    } else if (inFlight && args.acknowledged_event_id === inFlight.eventId) {
      inFlight = null;
      sendNextEdit();
    }
    // A valid edit can leave the displayed amount unchanged (or be rejected).
    // Consume its acknowledgement even when no HTML needs to be replaced.
    if (editor && args.html === current.html && args.parcel === current.parcel) return;
    const activeEditor = editor && args.parcel === current.parcel ? editor : null;
    const selection = activeEditor?.snapshot();
    if (editor && !activeEditor) editor.finish(false);
    current = args;
    // This markup comes exclusively from Python's escaped table renderer.
    // User text is never inserted here or interpolated into an event handler.
    // A prior edit can return from Python while the next amount is being typed.
    // Rebind that draft to the refreshed row instead of committing/cancelling it.
    refreshing = true;
    try {
      root.innerHTML = typeof args.html === 'string' ? args.html : '';
      root.querySelectorAll('.calc__name').forEach(label => {
        label.addEventListener('keydown', event => {
          if (event.key === 'Escape') {
            event.preventDefault();
            label.setAttribute('data-tip-dismissed', 'true');
          }
        });
        // A new pointer or keyboard visit may reveal the explanation again.
        for (const eventName of ['pointerenter', 'blur']) {
          label.addEventListener(eventName, () => label.removeAttribute('data-tip-dismissed'));
        }
      });
      let activeButton = null;
      root.querySelectorAll('button[data-field]').forEach(button => {
        button.addEventListener('click', () => startEdit(button));
        if (button.dataset.field === activeEditor?.field) activeButton = button;
      });
      if (activeEditor) {
        if (activeButton) activeEditor.restore(activeButton, selection);
        else activeEditor.finish(false);
      }
    } finally {
      refreshing = false;
    }
    height();
  }
  window.addEventListener('message', event => {
    if (event.source === window.parent && event.data?.type === 'streamlit:render') {
      render(event.data.args || {});
    }
  });
  window.addEventListener('resize', height);
  new ResizeObserver(height).observe(root);
  send('streamlit:componentReady', {apiVersion:1});
</script>
</body>
</html>
